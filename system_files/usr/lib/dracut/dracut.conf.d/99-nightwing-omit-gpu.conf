# --no-hostonly makes dracut's drm module pull in every in-tree GPU driver and
# its firmware. nightwing runs on a single NVIDIA card (proprietary driver), so
# none of them is needed before the root filesystem is mounted.
# A different GPU still works without changes; see 99-nvidia.conf for how to
# put a driver back into the initramfs or revert to Bazzite's setup.
omit_drivers+=" amdgpu radeon i915 xe nouveau "
