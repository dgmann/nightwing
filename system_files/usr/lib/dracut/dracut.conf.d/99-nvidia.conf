# Replaces Bazzite's 99-nvidia.conf, which forces i915, amdgpu and the NVIDIA
# modules into the initramfs. Together with all their firmware (every NVIDIA GSP
# generation, all amdgpu blobs) that made the initramfs ~231 MB: GRUB spent
# seconds reading it and dracut-pre-udev blocked ~7.5 s initialising the GPU
# before udev started. Disk unlock (TPM2) and the root mount need no GPU, so the
# GPU drivers now load from the root filesystem via udev, in parallel with the
# rest of the boot. Plymouth and the LUKS fallback prompt use simpledrm.
#
# force_drivers wins over omit_drivers in dracut, so the entries are dropped
# here instead of being omitted elsewhere.
