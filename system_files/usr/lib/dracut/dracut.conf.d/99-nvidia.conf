# Replaces Bazzite's 99-nvidia.conf, which forces i915, amdgpu and the NVIDIA
# modules into the initramfs. Together with all their firmware (every NVIDIA GSP
# generation, all amdgpu blobs) that made the initramfs ~231 MB: GRUB spent
# seconds reading it and dracut-pre-udev blocked ~7.5 s initialising the GPU
# before udev started. Disk unlock (TPM2) and the root mount need no GPU, so the
# GPU drivers now load from the root filesystem via udev, in parallel with the
# rest of the boot. Plymouth and the LUKS fallback prompt use simpledrm.
#
# force_drivers wins over omit_drivers in dracut, so the entries are dropped
# here instead of being omitted elsewhere.
#
# Changing the GPU or reverting
# - Any new GPU (NVIDIA, AMD, Intel) works without changes: its driver and
#   firmware load from the root filesystem, as they do now. Only the LUKS
#   fallback prompt and Plymouth run on simpledrm until then.
# - To load a GPU driver in the initramfs again (early KMS), remove it from
#   99-nightwing-omit-gpu.conf, add it here as
#     force_drivers+=" <module> "
#   and drop it from the guard regex at the end of build_files/build-initramfs.sh,
#   otherwise the build fails on purpose.
# - To restore Bazzite's behaviour completely, delete this file and
#   99-nightwing-omit-gpu.conf, and remove the guard (or the whole
#   build-initramfs.sh call in build.sh). The image build copies system_files
#   over the base image, so without this file the next build ships Bazzite's
#   original 99-nvidia.conf again.
