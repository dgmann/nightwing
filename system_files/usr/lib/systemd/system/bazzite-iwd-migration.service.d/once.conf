# Bazzite dropped this condition in ublue-os/bazzite@32d2ebd9 ("Always run
# bazzite-iwd-migration.service for now"), so the migration runs on every boot.
# Its `systemctl unmask wpa_supplicant` triggers a daemon reload that sits on the
# critical path before NetworkManager (~1.6 s). The service writes the marker
# itself, so it still runs once on a fresh install.
[Unit]
ConditionPathExists=!/var/lib/bazzite-iwd-migration.done
